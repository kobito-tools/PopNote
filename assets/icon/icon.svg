      <path d="M408 270h208"/>
      <path d="M408 330h208"/>
      <path d="M408 390h140"/>
    </g>
  </g>

  <!-- 箱 -->
  <rect x="300" y="620" width="424" height="236" rx="30" fill="url(#box)"/>
  <rect x="300" y="620" width="424" height="40" rx="20" fill="#5CC3C8"/>
  <!-- 箱の星 -->
  <path d="M512 690l18 38 42 5-31 29 8 41-37-20-37 20 8-41-31-29 42-5z" fill="#FFE066"/>
